<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Images </title>
    <style>
        @keyframes slide {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body style="padding-top: 150px;">
    <center>
        <div style="width: 100%; overflow: hidden; position: relative; white-space: nowrap;">
            <div style="display: flex; animation: slide 20s linear infinite;">
                <div style="width:500px; height: 450px;flex: 0 0 auto; margin-right: 20px;">
                    <img src="https://images.unsplash.com/photo-1738249034651-1896f689be58?q=80&w=1374&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Image 1" style="width: 100%; height: 100%; border-radius: 30px;">
                </div>
                <div style="width: 500px; height: 450px;flex: 0 0 auto; margin-right: 20px;">
                    <img src="https://plus.unsplash.com/premium_photo-1661962660197-6c2430fb49a6?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDYwfEZ6bzN6dU9ITjZ3fHxlbnwwfHx8fHw%3D" alt="Image 2" style="width: 100%; height: 100%; border-radius: 30px;">
                </div>
                <div style="width: 500px; height: 450px;flex: 0 0 auto; margin-right: 20px;">
                    <img src=https://images.unsplash.com/photo-1738783718799-e1971a11b644?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDE2fGhtZW52UWhVbXhNfHxlbnwwfHx8fHw%3D"" alt="Image 3" style="width: 100%; height: 100%; border-radius: 30px;">
                </div>
                <div style="width: 500px; height: 450px;flex: 0 0 auto; margin-right: 20px;">
                    <img src="https://images.unsplash.com/photo-1732445027511-4a6cde297c31?q=80&w=1374&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" style="width: 100%; height: 100%; border-radius: 30px;">

                </div>
            </div>
        </div>
    </center>
</body>
</html>
